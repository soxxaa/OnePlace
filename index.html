<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oneplace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth">
  <h1>Oneplace</h1>
  <input id="un" placeholder="Username" autocapitalize="none" hidden>
  <input id="email" type="email" placeholder="Email" autocapitalize="none">
  <input id="pw" type="password" placeholder="Password (6+ characters)">
  <div id="err"></div>
  <button class="btn" id="go">Log in</button>
  <button class="link" id="sw">No account? Sign up</button>
</div>

<div id="chat" hidden>
  <header>
    <div class="ttl">
      <div class="logo">O</div>
      <div><div class="t1">Oneplace</div><div class="t2" id="count">Everyone</div></div>
    </div>
    <button class="pill" id="anonBtn">Anon: Off</button>
    <button class="iconbtn" id="out" title="Log out">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <div id="list"></div>
  <div id="picker" hidden></div>

  <div id="bar">
    <input id="file" type="file" multiple hidden>
    <input id="voiceFile" type="file" accept="audio/*" capture hidden>
    <div class="field" id="field">
      <button class="ib" id="clip" title="Photo or file">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
      </button>
      <textarea id="txt" rows="1" placeholder="Message everyone..."></textarea>
      <button class="ib" id="at" title="Tag someone">@</button>
      <button class="ib" id="mic" title="Voice message">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="sendtxt" id="send">Send</button>
    </div>
  </div>
</div>

<div id="lb" hidden><img alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
